name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装 Qt 运行时依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libnss3 libasound2t64 \
            || sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libnss3 libasound2

      - name: 安装 bricks-qt（Essentials + markdown）
        run: |
          python -m pip install -U pip
          pip install -e ".[markdown]"

      - name: 能力后端状态（信息性）
        run: bricks-qt caps

      - name: 逐个 .ui 构建校验（出现未适配控件即失败）
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          fail=0
          for f in examples/*.ui; do
            echo "== $f"
            bricks-qt check "$f" --strict || fail=1
          done
          exit $fail

      - name: 上游 bricks 的 examples 也过一遍（真实覆盖）
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          git clone --depth 1 https://github.com/yumoqing/bricks.git _bricks
          python tests/ci_smoke.py examples _bricks/examples
